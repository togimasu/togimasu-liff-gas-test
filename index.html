<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <title>包丁研ぎのお申込み</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif; color: #252923; background: #f6f4ef; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px calc(32px + env(safe-area-inset-bottom)); }
    main { width: min(100%, 520px); margin: 0 auto; }
    h1 { margin: 8px 0 6px; font-size: 24px; }
    .intro, .hint { color: #646b62; font-size: 14px; line-height: 1.6; }
    .card { margin-top: 20px; padding: 22px 18px; border-radius: 16px; background: white; box-shadow: 0 4px 18px #26331a12; }
    label { display: block; margin: 18px 0 7px; font-size: 14px; font-weight: 700; }
    .value, input, select, textarea { width: 100%; border: 1px solid #d8ddd4; border-radius: 9px; background: #fff; padding: 12px; font: inherit; font-size: 16px; }
    .value { min-height: 46px; background: #f4f5f2; overflow-wrap: anywhere; }
    textarea { min-height: 110px; resize: vertical; }
    button { width: 100%; margin-top: 22px; padding: 14px 16px; border: 0; border-radius: 10px; background: #426b3e; color: white; font: inherit; font-size: 16px; font-weight: 700; }
    button:disabled { opacity: .55; }
    .status { padding: 16px 4px; color: #596158; }
    .error { color: #a12e25; }
    .success { color: #276139; }
    .row { padding: 14px 0; border-bottom: 1px solid #eceee9; }
    .row:last-child { border-bottom: 0; }
    .key { margin-bottom: 5px; color: #687065; font-size: 13px; }
    .data { white-space: pre-wrap; overflow-wrap: anywhere; }
    .zoom-overlay { position: fixed; z-index: 10; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); background: #182318; color: #fff; transition: transform .2s ease; }
    .zoom-overlay.is-upside-down { transform: rotate(180deg); }
    .zoom-label { margin: 0; font-size: 18px; }
    .zoom-number { font-size: clamp(96px, 34vw,  min(42vh, 240px)); font-weight: 800; line-height: 1; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
    .zoom-action { width: min(100%, 280px); margin: 0; background: #fff; color: #182318; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>包丁研ぎのお申込み</h1>
    <p class="intro">ご希望の受取り時間を選んでお申込みください。</p>
    <p id="status" class="status" role="status" aria-live="polite">LINEの情報を確認しています…</p>

    <section id="entry" class="card" hidden>
      <label>LINE表示名</label><div id="displayName" class="value"></div>
      <label for="applicationNo">申込番号</label><input id="applicationNo" type="text" readonly value="" placeholder="お申込み時に自動で発行します">
      <label for="pickupTime">受取り希望時間</label>
      <select id="pickupTime"></select>
      <label for="knifeCount">本数</label>
      <input id="knifeCount" type="number" min="1" step="1" value="1" required inputmode="numeric">
      <label for="notes">備考</label>
      <textarea id="notes" maxlength="1000" placeholder="ご要望があれば入力してください"></textarea>
      <button id="submitButton" type="button">申込む</button>
    </section>

    <section id="confirmation" class="card" hidden>
      <h2>お申込み済みです</h2>
      <p class="intro">申込内容をご確認ください。</p>
      <div class="row"><div class="key">申込番号</div><div id="confirmNo" class="data"></div></div>
      <button id="zoomButton" type="button" onclick="openNumberZoom()">拡大表示</button>
      <div class="row"><div class="key">申込日</div><div id="confirmDate" class="data"></div></div>
      <div class="row"><div class="key">LINE表示名</div><div id="confirmName" class="data"></div></div>
      <div class="row"><div class="key">受取り希望時間</div><div id="confirmTime" class="data"></div></div>
      <div class="row"><div class="key">本数</div><div id="confirmCount" class="data"></div></div>
      <div class="row"><div class="key">備考</div><div id="confirmNotes" class="data"></div></div>
      <div class="row"><div class="key">作業状況</div><div id="confirmStatus" class="data"></div></div>
    </section>
  </main>

  <section id="numberZoom" class="zoom-overlay" role="dialog" aria-modal="true" aria-labelledby="zoomLabel" hidden>
    <p id="zoomLabel" class="zoom-label">申込番号</p>
    <div id="zoomNumber" class="zoom-number" aria-live="polite"></div>
    <button class="zoom-action" type="button" onclick="toggleNumberZoomOrientation()">手動で反転</button>
    <button id="zoomCloseButton" class="zoom-action" type="button" onclick="closeNumberZoom()">閉じる</button>
  </section>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzxseejcXgVipPOB2hO_vs8KCeMe3BB8EqUBIuv_jGptRiJiyoVW6QmLbZmolrbomFDsA/exec';
    const LIFF_ID = '2011920848-fdZ0JLEN';
    const statusEl = document.getElementById('status');

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', isError);
    }

    function fillTimes() {
      const select = document.getElementById('pickupTime');
      [['希望なし', '希望なし']].concat(Array.from({ length: 17 }, (_, i) => {
        const minutes = 12 * 60 + i * 30;
        return [`${String(Math.floor(minutes / 60)).padStart(2, '0')}:${String(minutes % 60).padStart(2, '0')}`, `${String(Math.floor(minutes / 60)).padStart(2, '0')}:${String(minutes % 60).padStart(2, '0')}`];
      })).forEach(([label, value]) => {
        const option = document.createElement('option'); option.value = value; option.textContent = label; select.appendChild(option);
      });
    }

    async function callGAS(payload) {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error('サーバーとの通信に失敗しました。');
      return response.json();
    }

    async function init() {
      fillTimes();
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        const idToken = liff.getIDToken();
        if (!idToken) throw new Error('LINEのログイン情報を取得できませんでした。');

        const claims = liff.getDecodedIDToken();
        if (!claims || !claims.name) throw new Error('LINE表示名をIDトークンから取得できませんでした。');

        document.getElementById('displayName').textContent = claims.name;
        const result = await callGAS({ action: 'findToday', idToken: idToken });
        if (!result.success) throw new Error(result.message || '申込状況を確認できませんでした。');
        statusEl.hidden = true;
        if (result.record) showConfirmation(result.record);
        else {
          document.getElementById('entry').hidden = false;
          document.getElementById('submitButton').addEventListener('click', () => submitApplication(idToken));
        }
      } catch (error) {
        setStatus(`${error.message || '処理に失敗しました。'} 画面を再読み込みしてください。`, true);
        console.error(error);
      }
    }

    function showConfirmation(record) {
      document.getElementById('confirmNo').textContent = record.applicationNo;
      document.getElementById('confirmDate').textContent = record.applicationDate;
      document.getElementById('confirmName').textContent = record.displayName;
      document.getElementById('confirmTime').textContent = formatPickupDateTime(record);
      document.getElementById('confirmCount').textContent = `${record.knifeCount || 1}本`;
      document.getElementById('confirmNotes').textContent = record.notes || 'なし';
      document.getElementById('confirmStatus').textContent = record.workStatus;
      document.getElementById('confirmation').hidden = false;
    }

    function formatPickupDateTime(record) {
      if (record.pickupTime === '希望なし') return '希望なし';
      const date = String(record.applicationDate || '').replace(/^(\d{4})(\d{2})(\d{2})$/, '$1-$2-$3');
      return date ? `${date} ${record.pickupTime}` : record.pickupTime;
    }

    function openNumberZoom() {
      const applicationNo = document.getElementById('confirmNo').textContent.trim();
      const lastThreeDigits = applicationNo.match(/\d{3}$/);
      if (!lastThreeDigits) {
        setStatus('申込番号の末尾3桁を取得できませんでした。', true);
        return;
      }
      document.getElementById('zoomNumber').textContent = lastThreeDigits[0];
      const zoom = document.getElementById('numberZoom');
      zoom.classList.remove('is-upside-down');
      zoom.hidden = false;
      document.body.style.overflow = 'hidden';
      document.getElementById('zoomCloseButton').focus();
    }

    function toggleNumberZoomOrientation() {
      document.getElementById('numberZoom').classList.toggle('is-upside-down');
    }

    function closeNumberZoom() {
      document.getElementById('numberZoom').hidden = true;
      document.getElementById('numberZoom').classList.remove('is-upside-down');
      document.body.style.overflow = '';
      document.getElementById('zoomButton').focus();
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !document.getElementById('numberZoom').hidden) {
        closeNumberZoom();
      }
    });

    async function submitApplication(idToken) {
      const countInput = document.getElementById('knifeCount');
      if (!countInput.reportValidity()) return;
      const button = document.getElementById('submitButton');
      button.disabled = true;
      button.textContent = '申込中…';
      try {
        const result = await callGAS({
          action: 'create', idToken: idToken,
          pickupTime: document.getElementById('pickupTime').value,
          knifeCount: document.getElementById('knifeCount').value,
          notes: document.getElementById('notes').value.trim()
        });
        if (!result.success) throw new Error(result.message || '申込みに失敗しました。');
        location.reload();
      } catch (error) {
        setStatus(`${error.message || '申込みに失敗しました。'} 入力内容を確認して再度お試しください。`, true);
        button.disabled = false;
        button.textContent = '申込';
      }
    }

    init();
  </script>
</body>
</html>
