<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <title>申込管理</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif; color: #252923; background: #f6f4ef; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px calc(32px + env(safe-area-inset-bottom)); }
    main { width: min(100%, 900px); margin: 0 auto; }
    h1 { margin: 8px 0; font-size: 24px; }
    .intro, .status { color: #646b62; font-size: 14px; line-height: 1.6; }
    .toolbar { display: flex; gap: 8px; margin-top: 16px; }
    button { min-height: 46px; border: 1px solid #d8ddd4; border-radius: 9px; padding: 10px 12px; font: inherit; font-size: 16px; }
    button { border: 0; background: #426b3e; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; }
    .secondary { background: #e8ece5; color: #252923; }
    .card { margin-top: 18px; padding: 18px; border-radius: 14px; background: #fff; box-shadow: 0 4px 18px #26331a12; }
    .status.error { color: #a12e25; }
    .table-wrap { overflow-x: auto; margin-top: 18px; background: white; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #eceee9; text-align: left; vertical-align: top; font-size: 14px; }
    th { color: #596158; background: #f4f5f2; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    .application-link { border: 0; padding: 0; min-height: 0; background: transparent; color: #245e33; text-decoration: underline; font: inherit; font-weight: 700; }
    .empty { padding: 24px; text-align: center; color: #646b62; }
    [hidden] { display: none !important; }
    @media (max-width: 540px) { .toolbar { flex-direction: column; } }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <h1>申込管理</h1>
    <p class="intro">申込番号を押すと、Star webPRNT Browserで印刷ページを開きます。</p>
    <section id="keyPanel" class="card">
      <p>許可されたGoogleアカウントでログインしてください。</p>
      <div id="googleSignInButton"></div>
      <p id="status" class="status" role="status" aria-live="polite">Googleログインを準備しています…</p>
    </section>
    <section id="listPanel" hidden>
      <div class="toolbar">
        <button type="button" onclick="loadApplications()">一覧を更新</button>
        <button class="secondary" type="button" onclick="signOutFromManager()">ログアウト</button>
      </div>
      <div id="listStatus" class="status" role="status" aria-live="polite"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>申込番号</th><th>申込日</th><th>お名前</th><th>受取り希望時間</th><th>本数</th><th>備考</th><th>作業状況</th></tr></thead>
          <tbody id="applicationRows"></tbody>
        </table>
        <div id="emptyState" class="empty" hidden>申込はありません。</div>
      </div>
    </section>
  </main>
  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzxseejcXgVipPOB2hO_vs8KCeMe3BB8EqUBIuv_jGptRiJiyoVW6QmLbZmolrbomFDsA/exec';
    const statusEl = document.getElementById('status');
    const listStatusEl = document.getElementById('listStatus');
    let googleIdToken = '';

    function setStatus(element, message, isError = false) {
      element.textContent = message;
      element.classList.toggle('error', isError);
    }

    async function initializeGoogleSignIn() {
      setStatus(statusEl, 'Googleログインを準備しています…');
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'adminAuthConfig' })
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.message || 'Googleログインを準備できませんでした。');
        waitForGoogleIdentity(result.config.clientId);
      } catch (error) {
        setStatus(statusEl, error.message || '認証設定を取得できませんでした。', true);
      }
    }

    function waitForGoogleIdentity(clientId, attempts = 0) {
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({ client_id: clientId, callback: handleGoogleCredential });
        google.accounts.id.renderButton(document.getElementById('googleSignInButton'), {
          theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', locale: 'ja'
        });
        setStatus(statusEl, '許可されたGoogleアカウントでログインしてください。');
        return;
      }
      if (attempts > 40) {
        setStatus(statusEl, 'Googleログインを読み込めません。通信状態を確認して再読み込みしてください。', true);
        return;
      }
      setTimeout(() => waitForGoogleIdentity(clientId, attempts + 1), 250);
    }

    function handleGoogleCredential(credentialResponse) {
      googleIdToken = credentialResponse.credential || '';
      loadApplications();
    }

    function loadApplications() {
      if (!googleIdToken) return;
      setStatus(statusEl, 'Googleアカウントを確認して申込一覧を読み込んでいます…');
      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'adminList', idToken: googleIdToken })
      })
        .then(response => {
          if (!response.ok) throw new Error('申込一覧を読み込めませんでした。');
          return response.json();
        })
        .then(result => {
          if (!result.success) throw new Error(result.message || '申込一覧を読み込めませんでした。');
          const records = result.records || [];
          document.getElementById('listPanel').hidden = false;
          renderApplications(records);
          setStatus(statusEl, '申込一覧を読み込みました。');
          setStatus(listStatusEl, `${records.length}件`);
        })
        .catch(error => {
          setStatus(statusEl, error.message || '申込一覧を読み込めませんでした。', true);
        });
    }

    function renderApplications(records) {
      const body = document.getElementById('applicationRows');
      body.replaceChildren();
      document.getElementById('emptyState').hidden = records.length > 0;
      records.forEach(record => {
        const row = document.createElement('tr');
        const noCell = document.createElement('td');
        const link = document.createElement('button');
        link.type = 'button';
        link.className = 'application-link';
        link.textContent = record.applicationNo;
        link.addEventListener('click', () => openPrintPage(record));
        noCell.appendChild(link);
        row.appendChild(noCell);
        [record.applicationDate, record.displayName, record.pickupTime || '希望なし', `${record.knifeCount || 1}本`, record.notes || 'なし', record.workStatus || ''].forEach(value => {
          const cell = document.createElement('td');
          cell.textContent = value;
          row.appendChild(cell);
        });
        body.appendChild(row);
      });
    }

    function openPrintPage(record) {
      const printPageUrl = new URL('print.html', location.href);
      printPageUrl.searchParams.set('payload', JSON.stringify(record));
      const webPrntUrl = `webprnt://starmicronics.com/open?url=${encodeURIComponent(printPageUrl.href)}`;
      window.location.href = webPrntUrl;
    }

    function signOutFromManager() {
      googleIdToken = '';
      document.getElementById('listPanel').hidden = true;
      setStatus(statusEl, 'ログアウトしました。Googleアカウントでログインしてください。');
    }

    initializeGoogleSignIn();
  </script>
</body>
</html>
