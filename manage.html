<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <title>申込管理</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif; color: #252923; background: #f6f4ef; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px calc(32px + env(safe-area-inset-bottom)); }
    main { width: min(100%, 900px); margin: 0 auto; }
    h1 { margin: 8px 0; font-size: 24px; }
    .intro, .status { color: #646b62; font-size: 14px; line-height: 1.6; }
    .toolbar { display: flex; gap: 8px; margin-top: 16px; }
    button { min-height: 46px; border: 1px solid #d8ddd4; border-radius: 9px; padding: 10px 12px; font: inherit; font-size: 16px; }
    button { border: 0; background: #426b3e; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; }
    .secondary { background: #e8ece5; color: #252923; }
    .card { margin-top: 18px; padding: 18px; border-radius: 14px; background: #fff; box-shadow: 0 4px 18px #26331a12; }
    .status.error { color: #a12e25; }
    .table-wrap { overflow-x: auto; margin-top: 18px; background: white; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #eceee9; text-align: left; vertical-align: top; font-size: 14px; }
    th { color: #596158; background: #f4f5f2; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    .application-link { border: 0; padding: 0; min-height: 0; background: transparent; color: #245e33; text-decoration: underline; font: inherit; font-weight: 700; }
    .row-actions { display: flex; gap: 6px; }
    .row-actions button { min-height: 38px; padding: 7px 10px; font-size: 14px; white-space: nowrap; }
    .payment-button { background: #285d85; }
    .fee-input { width: 110px; min-height: 38px; border: 1px solid #d8ddd4; border-radius: 7px; padding: 6px 8px; font: inherit; font-size: 14px; }
    .return-date-cell { min-width: 220px; }
    .return-date-input { width: 190px; min-height: 38px; border: 1px solid #d8ddd4; border-radius: 7px; padding: 6px 8px; font: inherit; font-size: 14px; }
    .return-date-save { min-height: 34px; margin-top: 6px; padding: 6px 10px; font-size: 13px; }
    .test-output { overflow-wrap: anywhere; white-space: pre-wrap; padding: 12px; border-radius: 8px; background: #f4f5f2; font-size: 12px; }
    .empty { padding: 24px; text-align: center; color: #646b62; }
    [hidden] { display: none !important; }
    @media (max-width: 540px) { .toolbar { flex-direction: column; } }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <h1>申込管理</h1>
    <p class="intro">申込番号を押すと、Star webPRNT Browserで印刷ページを開きます。</p>
    <section id="keyPanel" class="card">
      <p>許可されたGoogleアカウントでログインしてください。</p>
      <div id="googleSignInButton"></div>
      <p id="status" class="status" role="status" aria-live="polite">Googleログインを準備しています…</p>
    </section>
    <section id="listPanel" hidden>
      <div class="toolbar">
        <button type="button" onclick="loadApplications()">一覧を更新</button>
        <button class="secondary" type="button" onclick="signOutFromManager()">ログアウト</button>
      </div>
      <div id="listStatus" class="status" role="status" aria-live="polite"></div>
      <pre id="squareTestOutput" class="test-output" hidden></pre>
      <div class="table-wrap">
        <table>
          <thead><tr><th>申込番号</th><th>申込日時</th><th>お名前</th><th>受取り希望日時</th><th>包丁の種類・長さ・本数</th><th>料金（円）</th><th>備考</th><th>返却日時</th><th>作業状況</th><th>操作</th></tr></thead>
          <tbody id="applicationRows"></tbody>
        </table>
        <div id="emptyState" class="empty" hidden>申込はありません。</div>
      </div>
    </section>
  </main>
  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzxseejcXgVipPOB2hO_vs8KCeMe3BB8EqUBIuv_jGptRiJiyoVW6QmLbZmolrbomFDsA/exec';
    let squarePosConfig = { appId: '', callbackUrl: '' };
    const statusEl = document.getElementById('status');
    const listStatusEl = document.getElementById('listStatus');
    let googleIdToken = sessionStorage.getItem('managerGoogleIdToken') || '';
    const applicationRecords = new Map();
    const pendingPaymentKey = 'squarePendingPayment';

    function setStatus(element, message, isError = false) {
      element.textContent = message;
      element.classList.toggle('error', isError);
    }

    async function initializeGoogleSignIn() {
      setStatus(statusEl, 'Googleログインを準備しています…');
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'adminAuthConfig' })
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.message || 'Googleログインを準備できませんでした。');
        waitForGoogleIdentity(result.config.clientId);
      } catch (error) {
        setStatus(statusEl, error.message || '認証設定を取得できませんでした。', true);
      }
    }

    function waitForGoogleIdentity(clientId, attempts = 0) {
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({ client_id: clientId, callback: handleGoogleCredential });
        google.accounts.id.renderButton(document.getElementById('googleSignInButton'), {
          theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', locale: 'ja'
        });
        setStatus(statusEl, '許可されたGoogleアカウントでログインしてください。');
        return;
      }
      if (attempts > 40) {
        setStatus(statusEl, 'Googleログインを読み込めません。通信状態を確認して再読み込みしてください。', true);
        return;
      }
      setTimeout(() => waitForGoogleIdentity(clientId, attempts + 1), 250);
    }

    function handleGoogleCredential(credentialResponse) {
      googleIdToken = credentialResponse.credential || '';
      sessionStorage.setItem('managerGoogleIdToken', googleIdToken);
      loadApplications();
    }

    function loadApplications() {
      if (!googleIdToken) return;
      setStatus(statusEl, 'Googleアカウントを確認して申込一覧を読み込んでいます…');
      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'adminList', idToken: googleIdToken })
      })
        .then(response => {
          if (!response.ok) throw new Error('申込一覧を読み込めませんでした。');
          return response.json();
        })
        .then(result => {
          if (!result.success) throw new Error(result.message || '申込一覧を読み込めませんでした。');
          const records = result.records || [];
          squarePosConfig = result.squareConfig || { appId: '', callbackUrl: '' };
          document.getElementById('listPanel').hidden = false;
          renderApplications(records);
          setStatus(statusEl, '申込一覧を読み込みました。');
          setStatus(listStatusEl, `${records.length}件`);
        })
        .catch(error => {
          setStatus(statusEl, error.message || '申込一覧を読み込めませんでした。', true);
        });
    }

    function renderApplications(records) {
      const body = document.getElementById('applicationRows');
      applicationRecords.clear();
      records.forEach(record => applicationRecords.set(record.applicationNo, record));
      body.replaceChildren();
      document.getElementById('emptyState').hidden = records.length > 0;
      records.forEach(record => {
        const row = document.createElement('tr');
        const noCell = document.createElement('td');
        noCell.textContent = record.applicationNo;
        row.appendChild(noCell);
        const knifeItems = record.knifeItems || [{ knifeType: record.knifeType || '未設定', knifeCount: record.knifeCount || 1 }];
        [formatApplicationDateTime(record.applicationDate), record.displayName, formatPickupDateTime(record), knifeItems.map(item => `${item.knifeType}${item.knifeLength ? ` ${item.knifeLength}` : ''} ${item.knifeCount}本`).join(' / ')].forEach(value => {
          const cell = document.createElement('td');
          cell.textContent = value;
          row.appendChild(cell);
        });
        const feeCell = document.createElement('td');
        const feeInput = document.createElement('input');
        feeInput.type = 'number';
        feeInput.min = '1';
        feeInput.step = '1';
        feeInput.inputMode = 'numeric';
        feeInput.className = 'fee-input';
        feeInput.setAttribute('aria-label', `${record.applicationNo} の料金（円）`);
        feeInput.placeholder = '金額を入力';
        feeCell.appendChild(feeInput);
        row.appendChild(feeCell);
        const notesCell = document.createElement('td');
        notesCell.textContent = record.notes || 'なし';
        row.appendChild(notesCell);
        const returnDateCell = document.createElement('td');
        returnDateCell.className = 'return-date-cell';
        const returnDateInput = document.createElement('input');
        returnDateInput.type = 'datetime-local';
        returnDateInput.className = 'return-date-input';
        returnDateInput.value = record.returnDateTime || '';
        returnDateInput.setAttribute('aria-label', `${record.applicationNo} の返却日時`);
        const returnDateSave = document.createElement('button');
        returnDateSave.type = 'button';
        returnDateSave.className = 'return-date-save';
        returnDateSave.textContent = '保存';
        returnDateSave.addEventListener('click', () => saveReturnDate(record, returnDateInput, returnDateSave));
        returnDateCell.append(returnDateInput, returnDateSave);
        row.appendChild(returnDateCell);
        const workStatusCell = document.createElement('td');
        workStatusCell.textContent = record.workStatus || '';
        row.appendChild(workStatusCell);
        const actionsCell = document.createElement('td');
        const actions = document.createElement('div');
        actions.className = 'row-actions';
        const receptionButton = document.createElement('button');
        receptionButton.type = 'button';
        receptionButton.textContent = '受付';
        receptionButton.addEventListener('click', () => openPrintPage(record));
        const paymentButton = document.createElement('button');
        paymentButton.type = 'button';
        paymentButton.className = 'payment-button';
        paymentButton.textContent = record.paymentStatus === '決済済み' ? '決済済み' : '決済';
        paymentButton.disabled = record.paymentStatus === '決済済み';
        paymentButton.addEventListener('click', () => launchSquarePos(record, feeInput.value));
        actions.append(receptionButton, paymentButton);
        if (record.paymentStatus === '決済済み') {
          const reprintButton = document.createElement('button');
          reprintButton.type = 'button';
          reprintButton.className = 'secondary';
          reprintButton.textContent = '領収書再印刷';
          reprintButton.addEventListener('click', () => openReceiptPage(record));
          actions.appendChild(reprintButton);
        }
        actionsCell.appendChild(actions);
        row.appendChild(actionsCell);
        body.appendChild(row);
      });
    }

    function openPrintPage(record) {
      const printPageUrl = new URL('print.html', location.href);
      printPageUrl.searchParams.set('payload', JSON.stringify(record));
      printPageUrl.hash = new URLSearchParams({ adminIdToken: googleIdToken }).toString();
      const webPrntUrl = `webprnt://starmicronics.com/open?url=${encodeURIComponent(printPageUrl.href)}`;
      window.location.href = webPrntUrl;
    }

    function openReceiptPage(record) {
      const url = new URL('print.html', location.href);
      url.searchParams.set('payload', JSON.stringify(record));
      url.searchParams.set('mode', 'receipt');
      url.hash = new URLSearchParams({ adminIdToken: googleIdToken }).toString();
      window.location.href = `webprnt://starmicronics.com/open?url=${encodeURIComponent(url.href)}`;
    }

    function handleSquareCallback() {
      const query = new URLSearchParams(location.search);
      let result = {};
      const raw = query.get('data');
      if (raw) { try { result = JSON.parse(raw); } catch (ignored) {} }
      for (const [key, value] of query.entries()) {
        if (key.startsWith('com.squareup.pos.')) result[key.slice('com.squareup.pos.'.length).toLowerCase()] = value;
      }
      if (!raw && !Object.keys(result).length) return;
      const pending = JSON.parse(sessionStorage.getItem(pendingPaymentKey) || 'null');
      history.replaceState(null, '', location.pathname);
      if (!pending) { setStatus(listStatusEl, '決済結果を受信しましたが、申込情報がありません。', true); return; }
      sessionStorage.removeItem(pendingPaymentKey);
      if (result.error_code || result.error_description || result.ERROR_CODE) {
        setStatus(listStatusEl, `Square決済は完了していません: ${result.error_description || result.error_code || 'キャンセル'}`, true);
        return;
      }
      if (!result.transaction_id && !result.server_transaction_id && !result.client_transaction_id) {
        setStatus(listStatusEl, 'Squareから決済完了を確認できませんでした。シートは更新していません。', true);
        return;
      }
      fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'adminMarkPaid', idToken: googleIdToken, applicationNo: pending.applicationNo,
          amount: pending.amount, transactionId: result.transaction_id || result.server_transaction_id || result.client_transaction_id })
      }).then(r => r.json()).then(data => {
        if (!data.success) throw new Error(data.message || '決済状態を保存できませんでした。');
        pending.paymentStatus = '決済済み'; pending.paidAmount = pending.amount;
        const record = pending.record || applicationRecords.get(pending.applicationNo) || { applicationNo: pending.applicationNo };
        record.paymentStatus = '決済済み'; record.paidAmount = pending.amount; record.paidAt = new Date().toLocaleString('ja-JP');
        openReceiptPage(record);
        setStatus(listStatusEl, `${pending.applicationNo} の決済を記録しました。`);
        loadApplications();
      }).catch(error => setStatus(listStatusEl, error.message, true));
    }

    async function saveReturnDate(record, input, button) {
      button.disabled = true;
      setStatus(listStatusEl, `${record.applicationNo} の返却日時を保存しています…`);
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'adminSetReturnDate',
            idToken: googleIdToken,
            applicationNo: record.applicationNo,
            returnDateTime: input.value
          })
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.message || '返却日時を保存できませんでした。');
        record.returnDateTime = result.returnDateTime || '';
        setStatus(listStatusEl, `${record.applicationNo} の返却日時を保存しました。`);
      } catch (error) {
        setStatus(listStatusEl, error.message || '返却日時を保存できませんでした。', true);
      } finally {
        button.disabled = false;
      }
    }

    function formatPickupDateTime(record) {
      if (!record.pickupTime || record.pickupTime === '希望なし') return '希望なし';
      const pickupDateTime = formatDateTime(record.pickupTime);
      if (pickupDateTime) return pickupDateTime;
      const applicationDate = formatDateTime(record.applicationDate);
      const time = String(record.pickupTime).match(/\b\d{1,2}:\d{2}\b/);
      return applicationDate && time ? `${applicationDate.slice(0, 10)} ${time[0].padStart(5, '0')}` : record.pickupTime;
    }

    function formatApplicationDateTime(value) {
      return formatDateTime(value) || String(value || '');
    }

    function formatDateTime(value) {
      const match = String(value || '').trim().match(/^(\d{4})-?(\d{2})-?(\d{2})(?:[ T]?(\d{1,2}):?(\d{2}))?/);
      if (!match) return '';
      const date = `${match[1]}-${match[2]}-${match[3]}`;
      return match[4] === undefined ? `${date} 00:00` : `${date} ${match[4].padStart(2, '0')}:${match[5]}`;
    }

    function launchSquarePos(record, feeValue) {
      const amount = Number(feeValue);
      if (!Number.isSafeInteger(amount) || amount < 1) {
        setStatus(listStatusEl, `${record.applicationNo} の料金を1円以上の整数で入力してください。`, true);
        return;
      }
      const hasAppId = Boolean(squarePosConfig.appId);
      const hasCallbackUrl = Boolean(squarePosConfig.callbackUrl);
      if (!hasAppId && hasCallbackUrl) {
        setStatus(listStatusEl, 'Square POSを起動するには、GAS のスクリプトプロパティに SQUARE_APP_ID を設定してください。', true);
        return;
      }
      const appId = squarePosConfig.appId || 'TEST_APPLICATION_ID';
      const callbackUrl = squarePosConfig.callbackUrl || `${location.origin}${location.pathname}`;
      const itemName = (record.knifeItems || []).map(item => `${item.knifeType}${item.knifeLength ? ` ${item.knifeLength}` : ''} ${item.knifeCount}本`).join(' / ') || record.knifeType || '商品';
      const note = `${itemName} / 申込番号: ${record.applicationNo}`;
      sessionStorage.setItem(pendingPaymentKey, JSON.stringify({ applicationNo: record.applicationNo, amount, record }));
      let squareUrl;
      if (/Android/i.test(navigator.userAgent)) {
        squareUrl = [
          'intent:#Intent', 'action=com.squareup.pos.action.CHARGE', 'package=com.squareup',
          `S.browser_fallback_url=${encodeURIComponent(callbackUrl)}`,
          `S.com.squareup.pos.WEB_CALLBACK_URI=${encodeURIComponent(callbackUrl)}`,
          `S.com.squareup.pos.CLIENT_ID=${encodeURIComponent(appId)}`,
          'S.com.squareup.pos.API_VERSION=v2.0', `i.com.squareup.pos.TOTAL_AMOUNT=${amount}`,
          'S.com.squareup.pos.CURRENCY_CODE=JPY', 'S.com.squareup.pos.TENDER_TYPES=com.squareup.pos.TENDER_CARD,com.squareup.pos.TENDER_CASH',
          `S.com.squareup.pos.NOTE=${encodeURIComponent(note)}`,
          `S.com.squareup.pos.REQUEST_METADATA=${encodeURIComponent(record.applicationNo)}`, 'end'
        ].join(';');
      } else {
        const data = {
          amount_money: { amount, currency_code: 'JPY' }, callback_url: callbackUrl,
          client_id: appId, version: '1.3', notes: note, state: record.applicationNo,
          options: { supported_tender_types: ['CREDIT_CARD', 'CASH'], auto_return: true }
        };
        squareUrl = `square-commerce-v1://payment/create?data=${encodeURIComponent(JSON.stringify(data))}`;
      }
      if (!hasCallbackUrl) {
        const output = document.getElementById('squareTestOutput');
        output.textContent = `テスト用にSquare起動URLを生成しました（コールバック未設定のため起動はしません）。\n\n${squareUrl}`;
        output.hidden = false;
        const setupNeeded = [!hasAppId && 'SQUARE_APP_ID', 'SQUARE_CALLBACK_URL'].filter(Boolean).join(' と ');
        setStatus(listStatusEl, `テスト用URLを生成しました。${setupNeeded} をGASのスクリプトプロパティに設定するとSquare POSを起動します。`);
        return;
      }
      document.getElementById('squareTestOutput').hidden = true;
      window.location.href = squareUrl;
    }

    function signOutFromManager() {
      googleIdToken = '';
      sessionStorage.removeItem('managerGoogleIdToken');
      document.getElementById('listPanel').hidden = true;
      setStatus(statusEl, 'ログアウトしました。Googleアカウントでログインしてください。');
    }

    initializeGoogleSignIn();
    handleSquareCallback();
  </script>
</body>
</html>
