<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <title>申込印刷</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif; color: #252923; background: #f6f4ef; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px calc(32px + env(safe-area-inset-bottom)); }
    main { width: min(100%, 480px); margin: 0 auto; }
    h1 { margin: 8px 0 18px; font-size: 28px; font-weight: 800; }
    .card { padding: 22px 18px; border-radius: 16px; background: white; box-shadow: 0 4px 18px #26331a12; }
    .number { margin: 0 0 18px; text-align: center; font-size: 30px; font-weight: 800; letter-spacing: .04em; }
    .qr-section { padding: 18px 0 4px; text-align: center; }
    .qr-section p { margin: 0 0 10px; color: #596158; font-size: 17px; font-weight: 700; }
    #applicationQr { display: flex; justify-content: center; min-height: 180px; }
    #applicationQr img, #applicationQr canvas { width: 180px !important; height: 180px !important; }
    .row { padding: 12px 0; border-bottom: 1px solid #eceee9; }
    .row:last-child { border-bottom: 0; }
    .label { margin-bottom: 4px; color: #50574d; font-size: 16px; font-weight: 700; }
    .value { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 20px; font-weight: 700; line-height: 1.5; }
    button { width: 100%; min-height: 50px; margin-top: 20px; border: 0; border-radius: 10px; background: #426b3e; color: white; font: inherit; font-size: 16px; font-weight: 700; }
    button:disabled { opacity: .55; }
    button.secondary { margin-top: 10px; background: #596158; }
    .status { min-height: 24px; color: #596158; font-size: 14px; line-height: 1.6; }
    .error { color: #a12e25; }
    [hidden] { display: none !important; }
    @media print {
      @page { margin: 8mm 5mm 22mm; }
      body { padding: 0; background: #fff; }
      main { width: 100%; }
      h1 { font-size: 24pt; font-weight: 800; }
      .card { padding: 8mm 5mm 20mm; box-shadow: none; }
      .number { font-size: 32pt; font-weight: 900; }
      .label { color: #222; font-size: 16pt; font-weight: 800; }
      .value { font-size: 20pt; font-weight: 800; line-height: 1.5; }
      .qr-section p { color: #222; font-size: 16pt; font-weight: 800; }
      button, .status { display: none !important; }
      .qr-section { break-inside: avoid; }
    }
  </style>
  <script src="js/StarWebPrintBuilder.js"></script>
  <script src="js/StarWebPrintTrader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <main>
    <h1>印刷内容</h1>
    <section id="content" class="card" hidden>
      <p id="applicationNo" class="number"></p>
      <div class="row"><div class="label">申込日時</div><div id="applicationDate" class="value"></div></div>
      <div class="row"><div class="label">お名前</div><div id="displayName" class="value"></div></div>
      <div class="row"><div class="label">受取り希望日時</div><div id="pickupTime" class="value"></div></div>
      <div class="row"><div class="label">返却日時</div><div id="returnDateTime" class="value"></div></div>
      <div class="row"><div class="label">包丁の種類・長さ・本数</div><div id="knifeSummary" class="value"></div></div>
      <div class="row"><div class="label">備考</div><div id="notes" class="value"></div></div>
      <div class="qr-section"><p>申込内容をLINEで確認</p><div id="applicationQr" role="img" aria-label="申込内容を開くQRコード"></div></div>
      <button id="printButton" type="button" onclick="printApplication()">SM-S230iへ印刷</button>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzxseejcXgVipPOB2hO_vs8KCeMe3BB8EqUBIuv_jGptRiJiyoVW6QmLbZmolrbomFDsA/exec';
    let record = {};
    const isReceipt = new URLSearchParams(location.search).get('mode') === 'receipt';
    try {
      record = JSON.parse(new URLSearchParams(location.search).get('payload') || '{}');
    } catch (error) {
      record = {};
    }
    record.adminIdToken = new URLSearchParams(location.hash.slice(1)).get('adminIdToken') || '';
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    // StarWebPrintTraderのブラウザー連携コールバックがグローバルのtraderを参照する。
    const liffUrl = new URL('https://liff.line.me/2011920848-fdZ0JLEN');
    if (record.applicationNo) liffUrl.searchParams.set('applicationNo', record.applicationNo);
    var trader;
    const statusEl = document.getElementById('status');
    if (record.applicationNo) {
      document.querySelector('h1').textContent = isReceipt ? '領収書' : '印刷内容';
      document.getElementById('applicationNo').textContent = record.applicationNo;
      document.getElementById('applicationDate').textContent = formatApplicationDateTime(record.applicationDate);
      document.getElementById('displayName').textContent = record.displayName || '';
      document.getElementById('pickupTime').textContent = formatPickupDateTime(record);
      document.getElementById('returnDateTime').textContent = formatReturnDateTime(record.returnDateTime);
      const knifeItems = record.knifeItems || [{ knifeType: record.knifeType || '未設定', knifeCount: record.knifeCount || 1 }];
      document.getElementById('knifeSummary').textContent = knifeItems.map(item => `${item.knifeType}${item.knifeLength ? ` ${item.knifeLength}` : ''} ${item.knifeCount}本`).join(' / ');
      document.getElementById('notes').textContent = record.notes || 'なし';
      if (isReceipt) {
        const amountRow = document.createElement('div'); amountRow.className = 'row';
        const label = document.createElement('div'); label.className = 'label'; label.textContent = 'お支払い金額';
        const value = document.createElement('div'); value.className = 'value'; value.textContent = `¥${Number(record.paidAmount || 0).toLocaleString('ja-JP')}`;
        amountRow.append(label, value); document.querySelector('.card').insertBefore(amountRow, document.querySelector('.qr-section'));
        document.getElementById('printButton').textContent = '領収書を印刷';
      }
      if (window.QRCode) new QRCode(document.getElementById('applicationQr'), { text: liffUrl.toString(), width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
      document.getElementById('content').hidden = false;
      if (isReceipt) setTimeout(printApplication, 250);
    } else {
      statusEl.textContent = '印刷する申込内容を開けませんでした。管理画面から申込番号を選び直してください。';
      statusEl.classList.add('error');
    }

    function formatPickupDateTime(record) {
      if (!record.pickupTime || record.pickupTime === '希望なし') return '希望なし';
      const pickupDateTime = formatDateTime(record.pickupTime);
      if (pickupDateTime) return pickupDateTime;
      const applicationDate = formatDateTime(record.applicationDate);
      const time = String(record.pickupTime).match(/\b\d{1,2}:\d{2}\b/);
      return applicationDate && time ? `${applicationDate.slice(0, 10)} ${time[0].padStart(5, '0')}` : record.pickupTime;
    }

    function formatApplicationDateTime(value) {
      return formatDateTime(value) || String(value || '');
    }

    function formatReturnDateTime(value) {
      return value ? String(value).replace('T', ' ') : '未設定';
    }

    function formatDateTime(value) {
      const match = String(value || '').trim().match(/^(\d{4})-?(\d{2})-?(\d{2})(?:[ T]?(\d{1,2}):?(\d{2}))?/);
      if (!match) return '';
      const date = `${match[1]}-${match[2]}-${match[3]}`;
      return match[4] === undefined ? `${date} 00:00` : `${date} ${match[4].padStart(2, '0')}:${match[5]}`;
    }

    async function printApplication() {
      const button = document.getElementById('printButton');
      button.disabled = true;
      showStatus('受付状況を更新しています…');
      try {
        if (!isReceipt) {
        const updateResponse = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'adminMarkReceived',
            idToken: record.adminIdToken,
            applicationNo: record.applicationNo
          })
        });
        const updateResult = await updateResponse.json();
        if (!updateResult.success) throw new Error(updateResult.message || '受付状況を更新できませんでした。');
        }
      } catch (error) {
        button.disabled = false;
        showStatus(error.message || '受付状況を更新できませんでした。管理画面から開き直してください。', true);
        return;
      }
      if (!window.StarWebPrintBuilder || !window.StarWebPrintTrader) {
        button.disabled = false;
        showStatus('Star webPRNT SDKを読み込めません。通信状態を確認してページを開き直してください。', true);
        return;
      }
      showStatus('プリンターに送信しています…');
      const builder = new StarWebPrintBuilder();
      const request = builder.createInitializationElement({ reset: true });
      const lines = [
        isReceipt ? '領収書' : '包丁研ぎ 受付票',
        '------------------------------',
        `申込番号: ${record.applicationNo}`,
        `申込日時: ${formatApplicationDateTime(record.applicationDate)}`,
        `お名前: ${record.displayName || ''}`,
        ...(isReceipt ? [`お支払い金額: ¥${Number(record.paidAmount || 0).toLocaleString('ja-JP')}`, '但し 商品代として', `決済日: ${record.paidAt || ''}`] : []),
        `受取り希望日時: ${formatPickupDateTime(record)}`,
        `返却日時: ${formatReturnDateTime(record.returnDateTime)}`,
        ...(record.knifeItems || [{ knifeType: record.knifeType || '未設定', knifeLength: '', knifeCount: record.knifeCount || 1 }]).map(item => `${item.knifeType}${item.knifeLength ? ` ${item.knifeLength}` : ''}: ${item.knifeCount}本`),
        `備考: ${record.notes || 'なし'}`,
        '------------------------------'
      ];
      const textRequest = builder.createTextElement({ codepage: 'cp998', linespace: 32, emphasis: true, height: 2, data: lines.join('\n') });
      trader = new StarWebPrintTrader({
        url: /Android/i.test(navigator.userAgent)
          ? 'https://localhost:8001/StarWebPRNT/SendMessage'
          : 'http://localhost:8001/StarWebPRNT/SendMessage',
        checkedblock: true,
        timeout: 90000
      });
      trader.onReceive = response => {
        button.disabled = false;
        if (response.traderSuccess) showStatus('印刷を完了しました。');
        else showStatus(`印刷に失敗しました（コード: ${response.traderCode}）。プリンターの接続と用紙を確認してください。`, true);
      };
      trader.onError = () => {
        button.disabled = false;
        showStatus('プリンターと通信できません。Star webPRNT Browserで開いているか、Bluetooth接続を確認してください。', true);
      };
      try {
        const qrRequest = builder.createQrCodeElement({ model: 'model2', level: 'level_m', cell: 5, data: liffUrl.toString() });
        const bottomMargin = builder.createFeedElement({ line: 10 });
        trader.sendMessage({ request: request + textRequest + qrRequest + bottomMargin });
      } catch (error) {
        button.disabled = false;
        showStatus(error.message || '印刷に失敗しました。', true);
      }
    }

    function showStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', isError);
    }
  </script>
</body>
</html>
